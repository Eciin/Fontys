- name: Update all packages on VMs
  hosts: all 
  become: yes  
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Upgrade all packages
      apt:
        upgrade: dist

- name: Setup firewall rules
  hosts: all
  become: yes
  tasks:
    - name: Ensure firewall is installed
      apt:
        name: ufw
        state: present
        
    - name: Enable UFW if not already enabled
      shell: 'yes | ufw enable'
      failed_when: false
      
    # Basic web traffic
    - name: Allow HTTP traffic (port 80)
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS traffic (port 443)
      ufw:
        rule: allow
        port: '443'
        proto: tcp
          
    - name: Allow Wazuh agent communication (port 1514/tcp)
      ufw:
        rule: allow
        port: '1514'
        proto: tcp

    - name: Allow Wazuh registration service (port 1515/tcp)
      ufw:
        rule: allow
        port: '1515'
        proto: tcp
    
    - name: Allow Wazuh API (port 55000)
      ufw:
        rule: allow
        port: '55000'
        proto: tcp
      when: inventory_hostname in groups['Wazuh-server']

    - name: Allow Wazuh indexer (port 9200)
      ufw:
        rule: allow
        port: '9200'
        proto: tcp
      when: inventory_hostname in groups['Wazuh-server']

    - name: Allow Wazuh dashboard (port 5601)
      ufw:
        rule: allow
        port: '5601'
        proto: tcp
      when: inventory_hostname in groups['Wazuh-server']
          
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

- name: Install Nagios Core on Ubuntu
  hosts: Server
  become: yes
  vars:
    nagios_version: "4.5.9"
    plugins_version: "2.4.12"

  tasks:
    - name: Install required packages
      apt:
        name:
          - build-essential
          - libgd-dev
          - openssl
          - libssl-dev
          - apache2
          - php
          - libapache2-mod-php
          - php-gd
          - unzip
          - wget
          - snmp
          - libnet-snmp-perl
          - gettext
          - autoconf
          - automake
          - libtool
        state: present

    - name: Create Nagios user and groups
      block:
        - name: Create nagcmd group
          group:
            name: nagcmd
            state: present
            system: yes
            
        - name: Create nagios user
          user:
            name: nagios
            state: present
            system: yes
            groups: nagcmd
            shell: /bin/false

        - name: Add www-data user to nagcmd group
          user:
            name: www-data
            groups: nagcmd
            append: yes

    - name: Download and install Nagios Core
      block:
        - name: Create temporary directory
          file:
            path: /tmp/nagios
            state: directory
            
        - name: Download Nagios Core
          get_url:
            url: "https://assets.nagios.com/downloads/nagioscore/releases/nagios-{{ nagios_version }}.tar.gz"
            dest: "/tmp/nagios/nagios-{{ nagios_version }}.tar.gz"
            
        - name: Extract Nagios Core
          unarchive:
            src: "/tmp/nagios/nagios-{{ nagios_version }}.tar.gz"
            dest: "/tmp/nagios"
            remote_src: yes
            
        - name: Configure Nagios
          command:
            cmd: ./configure --with-httpd-conf=/etc/apache2/conf-available --with-command-group=nagcmd
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Compile Nagios
          command:
            cmd: make all
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Install Nagios binaries
          command:
            cmd: make install
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Install Nagios command mode
          command:
            cmd: make install-commandmode
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Install Nagios configuration
          command:
            cmd: make install-config
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Install Nagios init script
          command:
            cmd: make install-daemoninit
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"
            
        - name: Install Nagios web configuration
          command:
            cmd: make install-webconf
            chdir: "/tmp/nagios/nagios-{{ nagios_version }}"

    - name: Create nagiosadmin user for web interface
      block:
        - name: Ensure apache2-utils is installed (for htpasswd command)
          apt:
            name: apache2-utils
            state: present
            
        - name: Create htpasswd file using command line
          shell: >
            htpasswd -bc /usr/local/nagios/etc/htpasswd.users nagiosadmin nagiosadmin && 
            chown nagios:nagios /usr/local/nagios/etc/htpasswd.users &&
            chmod 0644 /usr/local/nagios/etc/htpasswd.users

    - name: Download and install Nagios Plugins
      block:
        - name: Download Nagios Plugins
          get_url:
            url: "https://nagios-plugins.org/download/nagios-plugins-{{ plugins_version }}.tar.gz"
            dest: "/tmp/nagios/nagios-plugins-{{ plugins_version }}.tar.gz"
            
        - name: Extract Nagios Plugins
          unarchive:
            src: "/tmp/nagios/nagios-plugins-{{ plugins_version }}.tar.gz"
            dest: "/tmp/nagios"
            remote_src: yes
            
        - name: Configure Nagios Plugins
          command:
            cmd: ./configure --with-nagios-user=nagios --with-nagios-group=nagios
            chdir: "/tmp/nagios/nagios-plugins-{{ plugins_version }}"
            
        - name: Compile Nagios Plugins
          command:
            cmd: make
            chdir: "/tmp/nagios/nagios-plugins-{{ plugins_version }}"
            
        - name: Install Nagios Plugins
          command:
            cmd: make install
            chdir: "/tmp/nagios/nagios-plugins-{{ plugins_version }}"

    - name: Enable required Apache modules
      shell: a2enmod {{ item }}  
      with_items:
        - rewrite
        - cgi

    - name: Enable Nagios configuration in Apache
      shell: a2enconf nagios  
      args:
        creates: /etc/apache2/conf-enabled/nagios.conf

    - name: Restart services
      service:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      with_items:
        - apache2
        - nagios

    - name: Clean up installation files
      file:
        path: /tmp/nagios
        state: absent

- name: Gather facts from all hosts
  hosts: all!Server
  gather_facts: yes
  tasks: []  

- name: Add hosts to Nagios monitoring using facts
  hosts: Server
  become: yes
  tasks:
    - name: Check if Nagios is installed
      stat:
        path: /usr/local/nagios/bin/nagios
      register: nagios_installed
    - name: Create host configuration directory
      file:
        path: /usr/local/nagios/etc/hosts
        state: directory
        owner: nagios
        group: nagios
        mode: '0755'
      when: nagios_installed.stat.exists
    - name: Add host configurations using facts
      copy:
        content: |
          # {{ item }}.cfg - Host definition
          define host {
              use                     {% if hostvars[item].ansible_system is defined and hostvars[item].ansible_system == 'Linux' %}linux-server{% else %}generic-host{% endif %}
              
              host_name               {{ item }}
              alias                   {{ hostvars[item].ansible_hostname | default(item) }}
              address                 {{ hostvars[item].ansible_default_ipv4.address | default(hostvars[item].ansible_host) | default(item) }}
              hostgroups              linux-servers
              max_check_attempts      5
              check_period            24x7
              notification_interval   30
              notification_period     24x7
          }
        dest: "/usr/local/nagios/etc/hosts/{{ item }}.cfg"
        owner: nagios
        group: nagios
        mode: '0644'
      loop: "{{ groups['all'] | difference(['Server']) }}"
    - name: Ensure hosts directory is included in nagios.cfg
      lineinfile:
        path: /usr/local/nagios/etc/nagios.cfg
        line: "cfg_dir=/usr/local/nagios/etc/hosts"
        state: present
      notify: Restart Nagios
  handlers:
    - name: Restart Nagios
      service:
       name: nagios
       state: restarted            

- name: Configure Apache2 Webserver with HTTPS
  hosts: Webserver
  become: yes
  
  tasks:
    - name: Install Apache2 and SSL packages
      apt:
        name:
          - apache2
          - openssl
          - ssl-cert
        state: present
        update_cache: yes
      
    - name: Enable Apache SSL modules
      command: a2enmod {{ item }}
      with_items:
        - ssl
        - rewrite
      notify: Restart Apache2
    
    - name: Create SSL certificate directory
      file:
        path: /etc/ssl/private
        state: directory
        mode: '0700'
    
    - name: Generate self-signed certificate
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/ssl/private/apache-selfsigned.key
        -out /etc/ssl/certs/apache-selfsigned.crt
        -subj "/C=US/ST=State/L=City/O=Organization/CN=example.com"
      args:
        creates: /etc/ssl/certs/apache-selfsigned.crt
    
    - name: Enable SSL site configuration
      command: a2ensite default-ssl
      notify: Restart Apache2
    
    - name: Enable and start Apache2 service
      service:
        name: apache2
        state: started
        enabled: yes
  
  handlers:
    - name: Restart Apache2
      service:
        name: apache2
        state: restarted

- name: Install complete Wazuh stack
  hosts: Wazuh-server
  become: yes
  tasks:
    - name: Install required packages
      apt:
        name:
          - curl
          - apt-transport-https
          - gnupg
          - lsb-release
          - jq
        state: present
        update_cache: yes

    - name: Download Wazuh installation script
      get_url:
        url: https://packages.wazuh.com/4.11/wazuh-install.sh
        dest: /tmp/wazuh-install.sh
        mode: '0700'
        force: yes
        
    - name: Copy Wazuh configuration to default location
      copy:
        dest: /tmp/config.yml
        content: |
          nodes:
            # Wazuh indexer nodes
            indexer:
              - name: wazuh-indexer
                ip: {{ ansible_default_ipv4.address }}
                roles:
                  - indexer
            # Wazuh server nodes
            server:
              - name: wazuh-server
                ip: {{ ansible_default_ipv4.address }}
            # Wazuh dashboard nodes
            dashboard:
              - name: wazuh-dashboard
                ip: {{ ansible_default_ipv4.address }}
            
    - name: Generate Wazuh installation files
      shell: '/tmp/wazuh-install.sh -g'
      register: generate_config_result
      
    - name: Install complete Wazuh stack (All-in-one)
      shell: '/tmp/wazuh-install.sh -a'
      register: all_in_one_install_result
      
    - name: Wait for Wazuh components to start
      pause:
        seconds: 60

- name: Install Wazuh Agent prerequisites
  hosts: all:!Wazuh-server
  become: yes
  gather_facts: yes
  vars:
    wazuh_manager_ip: "{{ hostvars[groups['Wazuh-server'][0]]['ansible_default_ipv4']['address'] }}"
  tasks:
    - name: Install required packages
      package:
        name: 
          - curl
          - apt-transport-https
          - lsb-release
          - gnupg2
        state: present

    - name: Add Wazuh repository GPG key
      shell: 'curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import && chmod 644 /usr/share/keyrings/wazuh.gpg'
      args:
        creates: /usr/share/keyrings/wazuh.gpg
        
    - name: Add Wazuh repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        state: present
        filename: wazuh

    - name: Update apt cache
      apt:
        update_cache: yes
        
    - name: Install Wazuh agent
      package:
        name: wazuh-agent
        state: present

- name: Configure Wazuh agents
  hosts: all:!Wazuh-server
  become: yes
  vars:
    wazuh_manager_ip: "{{ hostvars[groups['Wazuh-server'][0]]['ansible_default_ipv4']['address'] }}"
  tasks:
    - name: Configure Wazuh agent
      lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        line: "<address>{{ wazuh_manager_ip }}</address>"
        backrefs: yes
    
    - name: Start Wazuh authentication daemon on server
      delegate_to: "{{ groups['Wazuh-server'][0] }}"
      become: yes
      shell: |
        /var/ossec/bin/wazuh-authd -p 1515 -f &
      async: 3600 
      poll: 0      
      
    - name: Wait for authentication daemon to start
      pause:
        seconds: 10
    
    - name: Register agent with server using agent-auth
      become: yes
      shell: |
        /var/ossec/bin/agent-auth -m {{ wazuh_manager_ip }} -A {{ inventory_hostname }}
      register: agent_auth_result
      failed_when: false
      
    - name: Display agent registration output
      debug:
        var: agent_auth_result.stdout_lines
      
    - name: Ensure Wazuh agent configuration is correct
      lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: yes
      with_items:
        - { regexp: '<server-ip>.*</server-ip>', line: '<server-ip>{{ wazuh_manager_ip }}</server-ip>' }
        - { regexp: '<server-hostname>.*</server-hostname>', line: '<server-hostname>{{ wazuh_manager_ip }}</server-hostname>' }
      
    - name: Restart Wazuh agent after registration
      systemd:
        name: wazuh-agent
        state: restarted

- name: Start Wazuh agents
  hosts: all:!Wazuh-server
  become: yes
  tasks:
    - name: Enable and start Wazuh Agent service
      systemd:
        name: wazuh-agent
        enabled: yes
        state: started
        
    - name: Wait for agent to initialize
      pause:
        seconds: 30
        
    - name: Check Wazuh agent status
      shell: /var/ossec/bin/agent_control -l
      register: agent_status
      delegate_to: "{{ groups['Wazuh-server'][0] }}"
      become: yes
      
    - name: Display agent status
      debug:
        var: agent_status.stdout_lines

# Removed the "Kill Auth daemon" task to keep it running

- name: Finalize installation
  hosts: Wazuh-server
  become: yes
  tasks:
    - name: Verify all agents are registered
      shell: /var/ossec/bin/agent_control -l
      register: final_agent_status
      
    - name: Display final agent status
      debug:
        var: final_agent_status.stdout_lines